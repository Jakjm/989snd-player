plugins {
     id 'com.android.application'
}

android {
    namespace = "com.opengoal.sndplayer"
    compileSdkVersion 35
    ndkVersion = "30.0.15729638"
    defaultConfig {
        applicationId "com.opengoal.sndplayer"
        // ES 3.0 GL context + std::filesystem push the floor up from SDL's
        // default of 21; cubeb's AAudio backend links libaaudio directly and uses
        // AAudioStreamBuilder_setUsage/setInputPreset (API 28), so 28 is the floor.
        minSdkVersion 28
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-28", "-DANDROID_STL=c++_shared"
                cppFlags "-std=c++20"
                // Add more ABIs here once the build is verified.
                abiFilters 'arm64-v8a'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            cmake {
                path 'jni/CMakeLists.txt'
            }
        }
    }
    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
