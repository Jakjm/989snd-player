name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump
        type: choice
        options: [patch, minor, major]
        default: patch

# Needed for the GITHUB_TOKEN to push the tag and create/edit the release.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Bump the version, push the tag, and open a DRAFT release. The build jobs
  # attach their assets to it; `publish` flips it to public once they all pass.
  cut_release:
    name: Cut release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: ${{ inputs.bump }}

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ steps.tag.outputs.new_tag }}"
          --draft --generate-notes --title "${{ steps.tag.outputs.new_tag }}"

  linux:
    name: Linux (Clang)
    needs: cut_release
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.cut_release.outputs.tag }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake ninja-build pkg-config \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev \
            wayland-protocols libxkbcommon-dev libasound2-dev libpulse-dev \
            libdbus-1-dev libudev-dev

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build --target sndplayer --parallel

      - name: Package
        run: tar -czf 989snd-player-linux-x86_64.tar.gz -C build sndplayer

      - name: Upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.cut_release.outputs.tag }}" 989snd-player-linux-x86_64.tar.gz --clobber

  windows:
    name: Windows (Clang)
    needs: cut_release
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.cut_release.outputs.tag }}

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          cmake --build build --target sndplayer --parallel

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build\sndplayer.exe -DestinationPath 989snd-player-windows-x64.zip

      - name: Upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.cut_release.outputs.tag }}" 989snd-player-windows-x64.zip --clobber

  android:
    name: Android (APK)
    needs: cut_release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.cut_release.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install NDK, SDK platform and CMake
        run: sdkmanager "platforms;android-35" "ndk;30.0.15729638" "cmake;3.22.1"

      # Ships the debug APK: it's debug-signed so it's installable, whereas
      # assembleRelease is unsigned (no signing config). Add a keystore secret +
      # signing config to publish a proper signed release APK.
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk 989snd-player-android.apk

      - name: Upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.cut_release.outputs.tag }}" 989snd-player-android.apk --clobber

  publish:
    name: Publish release
    needs: [cut_release, linux, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Undraft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.cut_release.outputs.tag }}" --draft=false
